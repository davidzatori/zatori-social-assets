name: Telegram senden

# Sendet die Posts aus telegram/outbox/ in die Telegram-Gruppen der ZATORI NATION.
# Der Bot-Token liegt als Repository-Secret TELEGRAM_BOT_TOKEN und wird nie ausgegeben.

on:
  push:
    branches: [main]
    paths: ['telegram/outbox/**']
  workflow_dispatch:
    inputs:
      aktion:
        description: 'flush = Outbox senden, discover = Gruppen/Themen neu erkennen, check = Status'
        type: choice
        options: [flush, discover, check]
        default: flush

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  senden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 telegram/tg.py ${{ inputs.aktion || 'flush' }}
      - name: Protokoll sichern
        if: always()
        run: |
          git config user.name "ZATORI Telegram Bot"
          git config user.email "noreply@zatoriai.com"
          git add -A telegram
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Telegram: Protokoll $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
